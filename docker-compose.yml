services:
  ubuntu:
    image: ubuntu:latest # see https://hub.docker.com/_/ubuntu
    command: /bin/bash # sarts a bash shell inside the container
    volumes:
      - ./:/app # mounts the current directory as /app inside the container
    working_dir: /app # sets the working directory to /app

    tty: true # direct output from the container to the terminal
    stdin_open: true # direct input from the terminal to the container

# Explanations:
#
# The command `docker compose run ubuntu` runs a new Docker container using the `ubuntu` service
# defined above. Docker compose creates a new container, starts the bash shell inside it,
# and provides access to an interactive shell.
